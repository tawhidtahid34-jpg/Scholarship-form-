<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>Premium Application Form - Alfaradhi Scholarship Exam</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 40px 0;
            background: linear-gradient(135deg, #dcedc8 0%, #aed581 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            width: 95%;
            max-width: 800px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin: 0 auto; 
            position: relative;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Ultra Premium Banner - HD & Crystal Clear Image Fix */
        .top-banner {
            width: 100%;
            height: 320px;
            /* ছবির ঘোলাটে ভাব দূর করার জন্য একদম নিখুঁত ও পরিষ্কার ব্যাকগ্রাউন্ড সেটিংস */
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 20%, rgba(0, 0, 0, 0.8) 100%), url('https://i.postimg.cc/D4QgTHzy/1791281489819.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            image-rendering: -webkit-optimize-contrast; /* ছবি এইচডি ও শার্প দেখানোর জন্য */
            border-bottom: 6px solid #ffca28; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px 30px 20px;
            box-sizing: border-box;
            position: relative;
        }

        .top-banner h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 2px 2px 6px rgba(0,0,0,1);
            color: #ffffff;
        }

        .top-banner p {
            margin: 8px 0 0;
            font-size: 18px;
            color: #ffca28;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 6px rgba(0,0,0,1);
        }

        /* Form Section */
        .form-section {
            padding: 40px 40px;
            position: relative;
            z-index: 2;
        }

        /* Stylish Watermark */
        .container::before {
            content: "";
            position: absolute;
            top: 320px; 
            left: 0;
            width: 100%;
            height: calc(100% - 320px);
            background-image: url('https://i.postimg.cc/Mf0DSNGc/1791281624199.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.1; 
            filter: grayscale(10%) sepia(40%);
            z-index: 1;
            pointer-events: none;
        }

        #scholarshipForm, #previewSection {
            position: relative;
            z-index: 3; 
        }

        /* CSS Grid Layout for Fields */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            position: relative;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #2e7d32;
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #c5e1a5;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            background-color: rgba(255, 255, 255, 0.8) !important;
            color: #111 !important;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-transform: uppercase; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .form-group input::placeholder {
            text-transform: none;
            font-weight: 400;
            color: #777 !important;
        }

        /* Glowing Neon Animation */
        @keyframes glowingLight {
            0% {
                box-shadow: 0 0 5px rgba(0, 230, 118, 0.4), inset 0 0 5px rgba(0, 230, 118, 0.2);
                border-color: #00e676;
            }
            100% {
                box-shadow: 0 0 15px rgba(0, 230, 118, 0.9), inset 0 0 10px rgba(0, 230, 118, 0.5);
                border-color: #69f0ae;
            }
        }

        .form-group input:focus, 
        .form-group select:focus {
            background-color: #ffffff !important;
            transform: translateY(-2px);
            outline: none;
            border-color: #00e676;
            animation: glowingLight 0.8s infinite alternate; 
        }

        input[type="file"] {
            padding: 12px 20px;
            background: #f1f8e9 !important;
            border: 2px dashed #8bc34a;
            cursor: pointer;
            text-transform: none;
            color: #333 !important;
        }

        /* Animated Submit Button */
        .submit-btn, .edit-btn, .confirm-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            color: white !important;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Poppins', sans-serif;
        }

        .submit-btn {
            background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%);
            box-shadow: 0 8px 25px rgba(27, 94, 32, 0.4);
            margin-top: 15px;
        }
        
        .submit-btn:hover { 
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 30px rgba(27, 94, 32, 0.6);
        }

        .edit-btn { background: linear-gradient(135deg, #fb8c00 0%, #e65100 100%); }
        .edit-btn:hover { transform: translateY(-3px); }

        .confirm-btn { background: linear-gradient(135deg, #1e88e5 0%, #0d47a1 100%); }
        .confirm-btn:hover { transform: translateY(-3px); }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        /* Preview Section */
        #previewSection {
            display: none;
            background: rgba(241, 248, 233, 0.95);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #aed581;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
        }

        #previewSection h3 {
            color: #1b5e20;
            margin-top: 0;
            border-bottom: 2px dashed #8bc34a;
            padding-bottom: 12px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .preview-item {
            font-size: 15px;
            color: #111;
            font-weight: 600;
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 4px solid #558b2f;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            text-transform: uppercase;
        }

        .preview-item strong {
            color: #2e7d32;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .preview-full {
            grid-column: 1 / -1;
        }

        /* Review Image Box Styling */
        .preview-images-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            grid-column: 1 / -1;
            margin-top: 10px;
        }

        .photo-preview-box {
            text-align: center;
            background: #f1f8e9;
            border: 2px dashed #8bc34a;
            padding: 15px;
            border-radius: 12px;
        }

        .preview-img-display {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
            margin: 10px auto 0 auto;
            border: 3px solid #ffffff;
            object-fit: contain;
        }

        .footer {
            text-align: center;
            font-size: 14px;
            color: #444;
            padding: 25px;
            background-color: rgba(232, 245, 233, 0.9);
            border-top: 1px solid #c8e6c9;
            position: relative;
            z-index: 3;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .footer b {
            color: #1b5e20;
            font-weight: 800;
        }

        /* Responsive Mobile Styles */
        @media (max-width: 650px) {
            body { padding: 15px 0; }
            .form-section { padding: 25px 15px; }
            .form-grid, .preview-grid, .preview-images-container { 
                grid-template-columns: 1fr; 
                gap: 18px; 
            }
            .top-banner h1 { font-size: 24px; }
            .top-banner p { font-size: 14px; }
            .btn-group { flex-direction: column; }
            .form-group input, .form-group select {
                font-size: 14px;
                padding: 14px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Premium Top Banner -->
        <div class="top-banner">
            <h1>ALFARADHI SCHOLARSHIP EXAM</h1>
            <p>APPLICATION PORTAL - 2027</p>
        </div>

        <div class="form-section">
            
            <!-- FORM SECTION -->
            <form id="scholarshipForm" onsubmit="showPreview(event)">
                
                <div class="form-grid">
                    
                    <div class="form-group full-width">
                        <label for="studentName">Student's Full Name</label>
                        <input type="text" id="studentName" placeholder="ENTER APPLICANT's FULL NAME" required>
                    </div>

                    <div class="form-group">
                        <label for="fatherName">Father's Name</label>
                        <input type="text" id="fatherName" placeholder="ENTER FATHER'S NAME" required>
                    </div>

                    <div class="form-group">
                        <label for="motherName">Mother's Name</label>
                        <input type="text" id="motherName" placeholder="ENTER MOTHER'S NAME" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Student's Age</label>
                        <input type="number" id="age" placeholder="e.g., 12" min="5" max="30" required>
                    </div>

                    <div class="form-group">
                        <label for="className">Current Class</label>
                        <select id="className" required>
                            <option value="" disabled selected>SELECT CLASS</option>
                            <option value="CLASS 1">CLASS 1</option>
                            <option value="CLASS 2">CLASS 2</option>
                            <option value="CLASS 3">CLASS 3</option>
                            <option value="CLASS 4">CLASS 4</option>
                            <option value="CLASS 5">CLASS 5</option>
                            <option value="CLASS 6">CLASS 6</option>
                            <option value="CLASS 7">CLASS 7</option>
                            <option value="CLASS 8">CLASS 8</option>
                            <option value="CLASS 9">CLASS 9</option>
                            <option value="CLASS 10">CLASS 10</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="institution">Institution Name</label>
                        <input type="text" id="institution" placeholder="ENTER CURRENT SCHOOL/MADRASAH" required>
                    </div>

                    <div class="form-group">
                        <label for="examCenter">Exam Center</label>
                        <input type="text" id="examCenter" placeholder="ENTER PREFERRED EXAM CENTER" required>
                    </div>

                    <div class="form-group">
                        <label for="headMobile">Head of Institution Mobile (11 Digits)</label>
                        <input type="tel" id="headMobile" placeholder="e.g., 017XXXXXXXX" pattern="[0-9]{11}" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Applicant's Mobile (11 Digits)</label>
                        <input type="tel" id="mobile" placeholder="e.g., 017XXXXXXXX" pattern="[0-9]{11}" required>
                    </div>

                    <!-- Passport Photo Upload -->
                    <div class="form-group">
                        <label for="photo">Passport Size Photo</label>
                        <input type="file" id="photo" accept="image/*" required>
                    </div>

                    <!-- Birth Certificate Photo Upload -->
                    <div class="form-group">
                        <label for="birthCertificate">Birth Certificate Photo</label>
                        <input type="file" id="birthCertificate" accept="image/*" required>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="submit-btn">Review Application</button>
                    </div>
                </div>
            </form>

            <!-- PREVIEW SECTION -->
            <div id="previewSection">
                <h3>Verify Your Information</h3>
                
                <div class="preview-grid">
                    <div class="preview-item preview-full"><strong>Student Name</strong> <span id="prevName"></span></div>
                    <div class="preview-item"><strong>Father's Name</strong> <span id="prevFather"></span></div>
                    <div class="preview-item"><strong>Mother's Name</strong> <span id="prevMother"></span></div>
                    <div class="preview-item"><strong>Age</strong> <span id="prevAge"></span> YEARS</div>
                    <div class="preview-item"><strong>Class</strong> <span id="prevClass"></span></div>
                    <div class="preview-item"><strong>Institution</strong> <span id="prevInst"></span></div>
                    <div class="preview-item"><strong>Exam Center</strong> <span id="prevCenter"></span></div>
                    <div class="preview-item"><strong>Head's Mobile</strong> <span id="prevHeadMob"></span></div>
                    <div class="preview-item preview-full"><strong>Applicant's Mobile</strong> <span id="prevMob"></span></div>
                    
                    <!-- Preview of Both Uploaded Photos -->
                    <div class="preview-images-container">
                        <div class="photo-preview-box">
                            <strong>Student Photo</strong>
                            <img id="prevPhotoImg" class="preview-img-display" src="" alt="Student Photo">
                        </div>
                        <div class="photo-preview-box">
                            <strong>Birth Certificate</strong>
                            <img id="prevBirthImg" class="preview-img-display" src="" alt="Birth Certificate Photo">
                        </div>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button type="button" class="edit-btn" onclick="hidePreview()">Go Back & Edit</button>
                    <button type="button" class="confirm-btn" onclick="finalSubmit()">Confirm & Submit</button>
                </div>
            </div>

        </div>

        <div class="footer">
            Supervised by: Alfaradhi Institutions<br>
            Technical Support: <b>মো তানজিব হোসাইন</b>
        </div>
    </div>

    <script>
        function showPreview(event) {
            event.preventDefault(); 
            
            document.getElementById('prevName').innerText = document.getElementById('studentName').value.toUpperCase();
            document.getElementById('prevFather').innerText = document.getElementById('fatherName').value.toUpperCase();
            document.getElementById('prevMother').innerText = document.getElementById('motherName').value.toUpperCase();
            document.getElementById('prevAge').innerText = document.getElementById('age').value;
            document.getElementById('prevClass').innerText = document.getElementById('className').value;
            document.getElementById('prevInst').innerText = document.getElementById('institution').value.toUpperCase();
            document.getElementById('prevCenter').innerText = document.getElementById('examCenter').value.toUpperCase(); 
            document.getElementById('prevHeadMob').innerText = document.getElementById('headMobile').value;
            document.getElementById('prevMob').innerText = document.getElementById('mobile').value;
            
            // Student Photo Preview
            var photoInput = document.getElementById('photo');
            var prevPhotoImg = document.getElementById('prevPhotoImg');
            if(photoInput.files.length > 0) {
                var reader1 = new FileReader();
                reader1.onload = function(e) {
                    prevPhotoImg.src = e.target.result;
                    prevPhotoImg.style.display = 'block';
                }
                reader1.readAsDataURL(photoInput.files[0]);
            }

            // Birth Certificate Preview
            var birthInput = document.getElementById('birthCertificate');
            var prevBirthImg = document.getElementById('prevBirthImg');
            if(birthInput.files.length > 0) {
                var reader2 = new FileReader();
                reader2.onload = function(e) {
                    prevBirthImg.src = e.target.result;
                    prevBirthImg.style.display = 'block';
                }
                reader2.readAsDataURL(birthInput.files[0]);
            }

            document.getElementById('scholarshipForm').style.display = 'none';
            document.getElementById('previewSection').style.display = 'block';
            
            document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function hidePreview() {
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('scholarshipForm').style.display = 'block';
            
            document.getElementById('prevPhotoImg').style.display = 'none';
            document.getElementById('prevBirthImg').style.display = 'none';
            document.querySelector('.container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function finalSubmit() {
            var mobileNum = document.getElementById('mobile').value;
            alert("APPLICATION SUBMITTED SUCCESSFULLY!\n\nPlease save your mobile number (" + mobileNum + ") to download your admit card later.");
            
            document.getElementById('scholarshipForm').reset();
            hidePreview();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
